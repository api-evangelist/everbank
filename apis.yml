name: EverBank
kind: company
description: EverBank, N.A. is a Jacksonville, Florida based national bank (Member
  FDIC) focused on high-yield consumer deposits, business and treasury banking, and
  commercial lending, serving customers nationwide online plus a small network of
  financial centers in Florida, California and New York. The bank operated as TIAA
  Bank from 2017 until 2023, when it was acquired by an investor group and reverted
  to the EverBank brand as an independent institution. Like most US banks, EverBank
  publishes NO first-party public developer API or developer portal; there is no
  documented open-banking, FDX, or CFPB Section 1033 data-access API exposed
  directly. Consumer-permissioned account data is reached only through third-party
  aggregators (e.g. Plaid, MX, Finicity), which is the honest, non-fabricated
  posture recorded here.
